<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Brandon Valley Lunch admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: top; }
    .report { padding: 12px 0; border-top: 1px solid var(--border); }
    .report:first-child { border-top: 0; }
    .report p { line-height: 1.45; }
  </style>
</head>
<body>
  <header class="app-header"><div class="header-inner"><h1 class="brand">Brandon Valley <span>Lunch</span> admin</h1></div></header>
  <main>
    <div class="view">
      <form id="keyForm" class="card field">
        <label class="field-label" for="key">Admin key</label>
        <input class="text-input" id="key" type="password" autocomplete="current-password">
        <button class="btn primary">Show reports and usage</button>
      </form>
      <div id="out" class="view"></div>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
