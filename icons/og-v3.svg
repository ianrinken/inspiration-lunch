<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d1012"/>
      <stop offset="1" stop-color="#c22527"/>
    </linearGradient>
    <clipPath id="screen"><rect x="792" y="68" width="308" height="560" rx="38"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#46321e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="14" fill="#A8181A"/>

  <!-- left: headline -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="88" y="150" font-size="30" font-weight="bold" fill="#A8181A" letter-spacing="3">NEW ON</text>
    <text x="88" y="232" font-size="68" font-weight="bold" fill="#2b2a28" letter-spacing="-1">Brandon Valley</text>
    <text x="88" y="312" font-size="68" font-weight="bold" fill="#A8181A" letter-spacing="-1">Lunch</text>

    <g fill="#2b2a28" font-size="28">
      <circle cx="100" cy="382" r="7" fill="#A8181A"/><text x="124" y="392">Set up by child: school, grade, activities</text>
      <circle cx="100" cy="436" r="7" fill="#A8181A"/><text x="124" y="446">Lunch, events and school info in one place</text>
      <circle cx="100" cy="490" r="7" fill="#A8181A"/><text x="124" y="500">7 pm heads-up, calendar sync, supply lists</text>
    </g>

    <rect x="88" y="540" width="372" height="56" rx="28" fill="#A8181A"/>
    <text x="274" y="577" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">brandonvalleylunch.com</text>
  </g>

  <!-- right: the app on a phone -->
  <g filter="url(#shadow)">
    <rect x="780" y="56" width="332" height="640" rx="50" fill="#1f1d1b"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="792" y="68" width="308" height="560" fill="#faf7f2"/>
    <rect x="792" y="68" width="308" height="112" fill="url(#hdr)"/>
    <g font-family="Helvetica, Arial, sans-serif">
      <text x="812" y="112" font-size="21" font-weight="bold" fill="#ffffff">Brandon Valley <tspan fill="#f4c95d">Lunch</tspan></text>
      <rect x="812" y="128" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="874" y="151" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">All my kids</text>

      <!-- kid chips -->
      <rect x="806" y="196" width="88" height="34" rx="17" fill="#ffffff" stroke="#e8e2d8"/>
      <text x="850" y="218" font-size="13" font-weight="bold" fill="#2b2a28" text-anchor="middle">Everything</text>
      <rect x="902" y="196" width="118" height="34" rx="17" fill="#ffffff" stroke="#e8e2d8"/>
      <text x="961" y="218" font-size="13" font-weight="bold" fill="#2b2a28" text-anchor="middle">2nd · Inspiration</text>
      <rect x="806" y="238" width="98" height="34" rx="17" fill="#ffffff" stroke="#e8e2d8"/>
      <text x="855" y="260" font-size="13" font-weight="bold" fill="#2b2a28" text-anchor="middle">7th · Middle</text>
      <rect x="912" y="238" width="96" height="34" rx="17" fill="#A8181A"/>
      <text x="960" y="260" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">All my kids</text>

      <!-- hero card -->
      <rect x="806" y="290" width="280" height="118" rx="16" fill="#ffffff" stroke="#e8e2d8"/>
      <rect x="806" y="290" width="6" height="118" rx="3" fill="#A8181A"/>
      <text x="826" y="318" font-size="10.5" font-weight="bold" fill="#A8181A" letter-spacing="1">TOMORROW · THURSDAY</text>
      <text x="826" y="348" font-size="22" font-weight="bold" fill="#2b2a28">Chicken Tenders</text>
      <text x="826" y="372" font-size="12.5" fill="#6b6760">with Belgium Waffle</text>
      <text x="826" y="394" font-size="12" font-weight="bold" fill="#2b2a28">Volleyball vs Marshall · 6:30 PM · Home</text>

      <!-- tabs -->
      <rect x="806" y="426" width="86" height="36" rx="18" fill="#A8181A"/>
      <text x="849" y="449" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Lunch</text>
      <rect x="900" y="426" width="88" height="36" rx="18" fill="#ffffff" stroke="#e8e2d8"/>
      <text x="944" y="449" font-size="13.5" font-weight="bold" fill="#2b2a28" text-anchor="middle">Events</text>
      <rect x="996" y="426" width="90" height="36" rx="18" fill="#ffffff" stroke="#e8e2d8"/>
      <text x="1041" y="449" font-size="13.5" font-weight="bold" fill="#2b2a28" text-anchor="middle">School</text>

      <!-- month rows -->
      <g fill="#ffffff" stroke="#e8e2d8">
        <rect x="806" y="480" width="280" height="40" rx="12"/>
        <rect x="806" y="528" width="280" height="40" rx="12"/>
        <rect x="806" y="576" width="280" height="40" rx="12"/>
      </g>
      <g font-size="12.5" fill="#6b6760">
        <text x="822" y="505"><tspan font-weight="bold" fill="#8d8780">1  THU</tspan>  <tspan fill="#2b2a28">Walking Taco</tspan></text>
        <text x="822" y="553"><tspan font-weight="bold" fill="#8d8780">2  FRI</tspan>  <tspan fill="#2b2a28">Cheeseburger</tspan></text>
        <text x="822" y="601"><tspan font-weight="bold" fill="#8d8780">5  MON</tspan>  <tspan fill="#2b2a28">Chicken Alfredo</tspan></text>
      </g>
    </g>
  </g>
</svg>
