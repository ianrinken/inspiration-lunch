<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brandon Valley Lunch</title>
  <meta name="description" content="Lunch menus, events and school info for every Brandon Valley school, set up for your kids. Brandon, SD.">
  <meta name="theme-color" content="#A8181A">

  <!-- Link previews (Facebook, iMessage, X, etc.) — absolute URLs required -->
  <link rel="canonical" href="https://brandonvalleylunch.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Brandon Valley Lunch">
  <meta property="og:url" content="https://brandonvalleylunch.com/">
  <meta property="og:title" content="Brandon Valley Lunch">
  <meta property="og:description" content="Lunch menus, events and school info for every Brandon Valley school, set up for your kids. Free, no sign-up, saves to your phone's home screen.">
  <meta property="og:image" content="https://brandonvalleylunch.com/icons/og-v4.png">
  <meta property="og:image:secure_url" content="https://brandonvalleylunch.com/icons/og-v4.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Brandon Valley Lunch — lunch menus, events and school info, set up for your kids">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Brandon Valley Lunch">
  <meta name="twitter:description" content="Lunch menus, events and school info for every Brandon Valley school, set up for your kids.">
  <meta name="twitter:image" content="https://brandonvalleylunch.com/icons/og-v4.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BV Lunch">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Brandon Valley <span>Lunch</span></h1>
      </div>
      <label class="school-picker">
        <span class="picker-label" id="schoolLabel">Inspiration Elementary</span>
        <svg class="picker-caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <select id="schoolSelect" aria-label="Choose school"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <div id="kidBar" class="kid-bar" role="group" aria-label="Whose schedule to show"></div>

    <div id="alertBar" class="alert-bar" role="status" hidden></div>
    <div id="installBanner" class="install-banner" hidden>
      <p id="installText"></p>
      <button id="installBtn" class="install-btn" hidden>Install</button>
      <button id="installClose" class="install-close" aria-label="Dismiss">&times;</button>
    </div>

    <div id="whatsNew" class="whats-new" hidden>
      <p><span class="wn-tag">New</span> Add your kids &mdash; school, grade, activities &mdash; then switch between one child, all of them, or everything. <button type="button" id="whatsNewGo" class="wn-link">Set up my kids</button></p>
      <button id="whatsNewClose" class="wn-close" aria-label="Dismiss">&times;</button>
    </div>

    <section id="hero" class="hero" hidden>
      <div id="heroCards"></div>
      <p class="hero-tomorrow" id="heroTomorrow" hidden></p>
      <p class="hero-weather" id="heroWeather" hidden></p>
      <div id="heroUpcoming" class="upcoming" hidden></div>
      <div id="heroLinks" class="hero-links" hidden></div>
    </section>

    <div class="tab-bar" role="tablist" aria-label="Calendar view">
      <button id="tabLunch" class="tab-btn active" role="tab" aria-selected="true">Lunch</button>
      <button id="tabEvents" class="tab-btn" role="tab" aria-selected="false">Events</button>
      <button id="tabSchool" class="tab-btn" role="tab" aria-selected="false">School</button>
    </div>
    <section id="schoolView" class="school-view" hidden></section>

    <nav class="month-nav" aria-label="Month navigation">
      <button id="prevMonth" class="nav-btn" aria-label="Previous month"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M6.5 1 1.5 6l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="monthLabel" class="month-label" aria-live="polite" title="Jump to today"></button>
      <button id="nextMonth" class="nav-btn" aria-label="Next month"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M1.5 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>

    <div class="weekday-row" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span class="wk-end">Sat</span><span class="wk-end">Sun</span>
    </div>
    <div id="calendar" class="calendar" role="grid"></div>
    <div id="statusArea" class="status-area" hidden></div>
    <p id="updatedNote" class="updated-note"></p>
  </main>

  <footer class="app-footer">
    <p>Menu subject to change &middot; <a href="https://linqconnect.com/public/menu/L36JZQ" target="_blank" rel="noopener">Official menu on LINQ Connect</a></p>
    <p class="footer-credit">Created by <a href="https://scratchmarketing.net" target="_blank" rel="noopener">Scratch Marketing &amp; Solutions</a></p>
  </footer>

  <!-- Day detail sheet -->
  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <div id="daySheet" class="day-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h2 id="sheetDate"></h2>
      <button id="sheetClose" class="sheet-close" aria-label="Close">&times;</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastUndo" class="toast-undo" hidden>Undo</button>
  </div>

  <script src="grades.js"></script>
  <script src="app.js"></script>
</body>
</html>
