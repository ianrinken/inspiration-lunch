<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brandon Valley Lunch</title>
  <meta name="description" content="Daily school lunch menus for Brandon Valley School District, Brandon SD">
  <meta name="theme-color" content="#A8181A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BV Lunch">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Brandon Valley <span>Lunch</span></h1>
      </div>
      <label class="school-picker">
        <span class="picker-label" id="schoolLabel">Inspiration Elementary</span>
        <svg class="picker-caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <select id="schoolSelect" aria-label="Choose school"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <section id="hero" class="hero" hidden>
      <button id="heroCard" class="hero-card">
        <p class="hero-kicker"><span id="heroLabel">Today</span> · <span id="heroDate"></span></p>
        <p class="hero-entree" id="heroName"></p>
        <p class="hero-sides" id="heroSides"></p>
        <p class="hero-alt" id="heroAlt"></p>
        <p class="hero-events" id="heroEvents"></p>
      </button>
      <p class="hero-tomorrow" id="heroTomorrow" hidden></p>
    </section>

    <nav class="month-nav" aria-label="Month navigation">
      <button id="prevMonth" class="nav-btn" aria-label="Previous month"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M6.5 1 1.5 6l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="monthLabel" class="month-label" aria-live="polite" title="Jump to today"></button>
      <button id="nextMonth" class="nav-btn" aria-label="Next month"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M1.5 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>

    <div class="weekday-row" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
    </div>
    <div id="calendar" class="calendar" role="grid"></div>
    <div id="statusArea" class="status-area" hidden></div>
    <p id="updatedNote" class="updated-note"></p>
  </main>

  <footer class="app-footer">
    <p>Menu subject to change &middot; <a href="https://linqconnect.com/public/menu/L36JZQ" target="_blank" rel="noopener">Official menu on LINQ Connect</a></p>
    <p class="footer-credit">Created by <a href="https://scratchmarketing.net" target="_blank" rel="noopener">Scratch Marketing &amp; Solutions</a></p>
  </footer>

  <!-- Day detail sheet -->
  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <div id="daySheet" class="day-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h2 id="sheetDate"></h2>
      <button id="sheetClose" class="sheet-close" aria-label="Close">&times;</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
