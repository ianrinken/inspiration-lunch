<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brandon Valley Lunch</title>
  <meta name="description" content="Lunch, school days, games and grade-by-grade guidance for Brandon Valley School District families, junior kindergarten through 12th grade, in one place.">
  <meta name="theme-color" content="#A8181A">
  <meta property="og:title" content="Brandon Valley Lunch">
  <meta property="og:description" content="Lunch, school days, games and what each grade needs, for Brandon Valley families. Free, no account.">
  <meta property="og:image" content="https://brandonvalleylunch.com/icons/og-v4.png">
  <meta property="og:url" content="https://brandonvalleylunch.com/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BV Lunch">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="brand" id="appBrand">Brandon Valley <span>Lunch</span></h1>
      <div class="school-brand" id="schoolBrand" hidden></div>
      <div class="header-actions">
        <button id="searchBtn" class="header-btn header-ask" aria-label="Ask a question" data-i18n-label="Ask a question" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10.5H9.5L5 20v-4H4z"/></svg><span data-i18n="Ask">Ask</span></button>
        <button id="studentsBtn" class="header-btn" data-i18n="Students" hidden>Students</button>
      </div>
    </div>
  </header>

  <nav id="kidBar" class="kid-bar" aria-label="Students" data-i18n-label="Students" hidden>
    <div id="kidChips" class="kid-chips" role="group" aria-label="Choose student" data-i18n-label="Choose student"></div>
  </nav>

  <main id="main">
    <p id="offlineNote" class="offline-note" role="status" hidden></p>
    <div id="alertBar" class="alert-bar" hidden></div>
    <div id="backBar" class="back-bar" hidden></div>
    <div id="installBanner" class="install-banner" hidden>
      <p id="installText"></p>
      <button id="installBtn" class="install-btn" data-i18n="Install" hidden>Install</button>
      <button id="installClose" class="install-close" aria-label="Dismiss" data-i18n-label="Dismiss">&times;</button>
    </div>

    <section id="view-today" class="view" data-view="today"></section>
    <section id="view-lunch" class="view" data-view="lunch" hidden></section>
    <section id="view-calendar" class="view" data-view="calendar" hidden></section>
    <section id="view-guide" class="view" data-view="guide" hidden></section>
    <section id="view-school" class="view" data-view="school" hidden></section>

    <footer class="app-footer">
      <p data-i18n="An independent app, not run by the Brandon Valley School District. Built from public district, LINQ Connect and Bound information; for anything official, check with your school.">An independent app, not run by the Brandon Valley School District. Built from public district, LINQ Connect and Bound information; for anything official, check with your school.</p>
      <p><a href="privacy.html" data-i18n="Privacy">Privacy</a></p>
      <p class="footer-credit">Created by <a href="https://scratchmarketing.net" target="_blank" rel="noopener">Scratch Marketing &amp; Solutions</a></p>
    </footer>
  </main>

  <nav class="tab-bar" aria-label="Sections" data-i18n-label="Sections">
    <button class="tab" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <span data-i18n="Today">Today</span>
    </button>
    <button class="tab" data-tab="lunch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M16.5 21V3c-2.2 1.3-3.5 4-3.5 7.5V13h3.5"/></svg>
      <span data-i18n="Lunch">Lunch</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span data-i18n="Calendar">Calendar</span>
    </button>
    <button class="tab" data-tab="guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v5c1.6 1.6 3.4 2.3 5.5 2.3s3.9-.7 5.5-2.3v-5M21.5 9v5.5"/></svg>
      <span data-i18n="Guide">Guide</span>
    </button>
    <button class="tab" data-tab="school">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18M5 20.5V10l7-5.5 7 5.5v10.5"/><path d="M10 20.5v-5h4v5"/></svg>
      <span data-i18n="School">School</span>
    </button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <button id="sheetBack" class="sheet-back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="Back">Back</span></button>
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="sheet-close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="Close">Close</span></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastUndo" class="toast-undo" data-i18n="Undo" hidden>Undo</button>
  </div>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="handbooks.js"></script>
  <script src="i18n.js"></script>
  <script src="handbooks-es.js"></script>
  <script src="app.js"></script>
</body>
</html>
