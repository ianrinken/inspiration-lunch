[build]
  publish = "."
  functions = "netlify/functions"

# The push library can't be bundled by esbuild (dynamic requires), so ship
# it alongside the functions as plain node_modules.
[functions]
  included_files = ["node_modules/**"]

# Repo housekeeping files aren't part of the site.
[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
