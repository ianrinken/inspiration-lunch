[build]
  publish = "."
  functions = "netlify/functions"

# The push library can't be bundled by esbuild (dynamic requires), so ship
# it alongside the functions as plain node_modules.
[functions]
  included_files = ["node_modules/**"]

# Repo housekeeping files aren't part of the site.
[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# Clean calendar-feed addresses (Google's "add by URL" wants a .ics path).
# /feed/<school>/<grade or all>/<activities or all>/calendar.ics
[[redirects]]
  from = "/feed/:school/:grade/:acts/calendar.ics"
  to = "/.netlify/functions/events?school=:school&feed=1&grade=:grade&acts=:acts"
  status = 200
